app = 'dischess-hub'
primary_region = 'gru'

[build]
  builder = 'paketobuildpacks/builder:base'

[processes]
  app = "python main.py"

[http_service]
  internal_port = 8080
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
