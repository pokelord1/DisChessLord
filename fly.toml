# fly.toml app configuration file generated for dischess-hub on 2026-11-02T18:20:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dischess-hub'
primary_region = 'gru'

[build]
  builder = 'paketobuildpacks/builder:base'

[processes]
  app = 'python main.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
